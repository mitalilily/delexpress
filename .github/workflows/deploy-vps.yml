name: Deploy To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '.env.production' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/expressopro/current/"

      - name: Build and restart services
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -e

          sudo install -d -m 755 -o deploy -g deploy /srv/expressopro/current

          cat >/srv/expressopro/current/ecosystem.config.js <<'PM2'
          module.exports = {
            apps: [
              {
                name: 'expressopro-api',
                cwd: '/srv/expressopro/current/backend',
                script: 'dist/index.js',
                instances: 1,
                exec_mode: 'fork',
                env: {
                  NODE_ENV: 'production',
                  PORT: '5002',
                },
              },
            ],
          }
          PM2

          cd /srv/expressopro/current/backend
          npm ci
          NODE_ENV=production npm run build

          cd /srv/expressopro/current/admin-dashboard
          npm install --legacy-peer-deps
          CI=false npm run build

          cd /srv/expressopro/current/courier-cart-client
          npm ci
          npm run build:netlify

          cd /srv/expressopro/current/delexpress
          npm ci
          npm run build

          cd /srv/expressopro/current
          pm2 startOrReload ecosystem.config.js
          pm2 save

          sudo nginx -t
          sudo systemctl reload nginx
          EOF
